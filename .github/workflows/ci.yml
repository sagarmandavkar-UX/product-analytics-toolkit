name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate analytics workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q analysis ab_testing pm_tools

      - name: Run product analytics report
        env:
          MPLBACKEND: Agg
        run: python analysis/product_analytics_dashboard.py

      - name: Run A/B testing report
        run: python ab_testing/ab_test_framework.py

      - name: Run RICE prioritization
        run: python pm_tools/feature_prioritization_RICE.py
